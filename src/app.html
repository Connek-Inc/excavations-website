<!DOCTYPE html>
<html lang="fr" class="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#febd17" />
		<meta name="format-detection" content="telephone=yes" />

		<!-- Favicons & Icons -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/logo.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/logo.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<!-- Performance: Preconnect to critical origins -->
		<link rel="preconnect" href="https://gateway.moneris.com" crossorigin />
		<link rel="dns-prefetch" href="https://gateway.moneris.com" />
		<link rel="preconnect" href="https://www.google.com" crossorigin />
		<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
		<link rel="dns-prefetch" href="https://wa.me" />
		<link rel="dns-prefetch" href="https://www.google.com/maps" />

		<!-- Performance: priority hints + early hints -->
		<meta http-equiv="x-dns-prefetch-control" content="on" />
		<meta name="format-detection" content="telephone=no" />

		<!-- SEO: Search engine directives -->
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta name="googlebot" content="index, follow" />
		<meta name="bingbot" content="index, follow" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />

		<!-- Geo targeting: Quebec, Canada -->
		<meta name="geo.region" content="CA-QC" />
		<meta name="geo.placename" content="Québec, Montréal, Laval, Laurentides" />
		<meta name="geo.position" content="46.8139;-71.2080" />
		<meta name="ICBM" content="46.8139, -71.2080" />

		<!-- Google Search Console verification -->
		<meta name="google-site-verification" content="YIshcnjVUMgSrAilT7URV19Xwf8Ubl_zA8bLjR8NJzM" />

		<!-- Author / Publisher -->
		<meta name="author" content="Mini Excavations Érable" />
		<meta name="publisher" content="Mini Excavations Érable" />
		<meta name="copyright" content="Mini Excavations Érable" />

		<script src="https://gateway.moneris.com/chktv2/js/chkt_v2.00.js" defer></script>

		<!-- Google tag (gtag.js) - Google Ads + Consent Mode v2 -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18036493782"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);}
		  window.gtag = gtag;

		  // Consent Mode v2 — Loi 25 Quebec compliant
		  // Default: denied. User must explicitly grant via consent banner.
		  // Stored consent (if any) overrides this on subsequent visits.
		  var stored = null;
		  try { stored = localStorage.getItem('mi_consent'); } catch(e) {}
		  var initialConsent = stored === 'granted' ? 'granted' : 'denied';

		  gtag('consent', 'default', {
		    'ad_storage': initialConsent,
		    'ad_user_data': initialConsent,
		    'ad_personalization': initialConsent,
		    'analytics_storage': initialConsent,
		    'wait_for_update': 500
		  });

		  gtag('js', new Date());
		  gtag('config', 'AW-18036493782', {
		    'allow_enhanced_conversions': true,
		    'anonymize_ip': true
		  });

		  // Event snippet for Contact conversion page
		  function gtag_report_conversion(url) {
		    var callback = function () {
		      if (typeof(url) != 'undefined') {
		        window.location = url;
		      }
		    };
		    gtag('event', 'conversion', {
		        'send_to': 'AW-18036493782/1_cdCLOF6qUcENabvJhD',
		        'event_callback': callback
		    });
		    return false;
		  }
		  window.gtag_report_conversion = gtag_report_conversion;
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
