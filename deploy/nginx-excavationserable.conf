# ╔════════════════════════════════════════════════════════════════════════════
# ║ nginx — reverse proxy para excavationserable.com
# ║
# ║ En Hostinger, LiteSpeed servía build/ directo y solo despertaba a Node
# ║ para /api/*. En el VPS hacemos que TODO pase por nginx → Express (:3000),
# ║ que ya sabe servir la build estática Y los proxies /api/connek/*.
# ║
# ║ Instalar:
# ║   sudo cp deploy/nginx-excavationserable.conf \
# ║           /etc/nginx/sites-available/excavationserable.com
# ║   sudo ln -s /etc/nginx/sites-available/excavationserable.com \
# ║              /etc/nginx/sites-enabled/
# ║   sudo nginx -t && sudo systemctl reload nginx
# ║
# ║ TLS: este archivo es el de ARRANQUE (solo :80). Después de correr
# ║ `sudo certbot --nginx -d excavationserable.com -d www.excavationserable.com`
# ║ certbot reescribe este bloque agregando el 443 + redirect automático.
# ╚════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name excavationserable.com www.excavationserable.com;

    # Subí un poco el límite porque el form manda JSON (server.js acepta 1mb).
    client_max_body_size 2m;

    # Cabeceras reales hacia Express (server.js hace app.set('trust proxy', 1)).
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Assets estáticos con hash de SvelteKit: cache largo (Express ya los sirve,
    # pero esto ahorra round-trips si querés que nginx los cachee a futuro).
    location /_app/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
