# Nginx reverse proxy para excavationserable.com (VPS Hostinger).
#
# Instalar:
#   sudo cp deploy/nginx-excavationserable.conf /etc/nginx/sites-available/excavationserable
#   sudo ln -s /etc/nginx/sites-available/excavationserable /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después: sudo certbot --nginx -d excavationserable.com -d www.excavationserable.com
# Certbot reescribe este archivo solo para agregar el bloque 443 + SSL.

server {
    listen 80;
    listen [::]:80;
    server_name excavationserable.com www.excavationserable.com;

    # Tamaño máximo del body (el form de soumission es chico, 1mb sobra)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
